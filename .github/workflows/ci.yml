name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

# Least privilege: checkout only. No contents write, id-token, packages, or deployments.
permissions:
  contents: read

# Stale pull-request runs are cancelled. Pushes to the default branch are not cancelled
# so a merge commit's checks can finish even if another push follows.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Store cache is keyed on the lockfile. Install always runs with a frozen lockfile
      # so a cache hit cannot skip dependency resolution or accept a different graph.
      # Do not cache node_modules or .turbo — those would skip correctness work.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production builds
        run: pnpm build
